name: Add-on checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  image:
    name: Build and smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paine:check ./paine
      - name: Load the packaged app and water reference offline
        run: >-
          docker run --rm --network none paine:check python -c
          "import paine.run, paine.water_reader;
          from paine.water_locator import load_reference;
          assert len(load_reference()['points']) > 0"
