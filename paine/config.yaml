name: Paine pressure gauge
version: "1.0.5"
slug: paine
description: Read a camera pressure gauge and publish pressure with MQTT discovery
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
options:
  camera_host: ""
  camera_user: ""
  camera_password: ""
  stream: 1
  capture_interval: 60
  capture_timeout: 10
  two_bar_angle: 356.0
  three_bar_angle: 61.0
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_tls: false
  sensor_name: Heating circulatory water pressure
  sensor_id: paine_pressure
  state_topic: paine/pressure/state
  discovery_prefix: homeassistant
  expire_after: 300
  device_id: paine_pressure_gauge
  device_name: Paine pressure gauge
  suggested_area: ""
schema:
  camera_host: str
  camera_user: str
  camera_password: password
  stream: int(1,2)
  capture_interval: int(15,86400)
  capture_timeout: int(1,300)
  two_bar_angle: float(0,359.99)
  three_bar_angle: float(0,359.99)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_tls: bool
  sensor_name: str
  sensor_id: str
  state_topic: str
  discovery_prefix: str
  expire_after: int(1,172800)
  device_id: str
  device_name: str
  suggested_area: str
