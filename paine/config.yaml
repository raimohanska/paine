name: Paine pressure gauge
version: "1.1.1"
slug: paine
description: Read one or more camera pressure gauges and publish MQTT sensors
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
panel_title: Paine cameras
panel_icon: mdi:gauge
panel_admin: true
options:
  capture_interval: 60
  shot_count: 3
  capture_timeout: 10
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_tls: false
  gauges: []
schema:
  camera_host: str?
  camera_user: str?
  camera_password: password?
  capture_interval: int(15,86400)
  shot_count: int(1,9)
  capture_timeout: int(1,300)
  two_bar_angle: float(0,359.99)?
  three_bar_angle: float(0,359.99)?
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_tls: bool
  sensor_name: str?
  sensor_id: str?
  state_topic: str?
  device_id: str?
  device_name: str?
  gauges:
    - camera_host: str
      camera_user: str
      camera_password: password
      sensor_id: str
      two_bar_angle: float(0,359.99)
      three_bar_angle: float(0,359.99)
      sensor_name: str?
      device_id: str?
      device_name: str?
      state_topic: str?
      capture_interval: int(15,86400)?
      shot_count: int(1,9)?
      capture_timeout: int(1,300)?
      mqtt_host: str?
      mqtt_port: port?
      mqtt_user: str?
      mqtt_password: password?
      mqtt_tls: bool?
