name: Paine pressure gauge
version: "1.1.2"
slug: paine
description: Read one or more camera pressure gauges and publish MQTT sensors
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
options:
  camera_host: ""
  camera_user: ""
  camera_password: ""
  two_bar_angle: 356.0
  three_bar_angle: 61.0
  sensor_name: Heating circulatory water pressure
  sensor_id: paine_pressure
  device_id: paine_pressure_gauge
  device_name: Paine pressure gauge
  state_topic: paine/pressure/state
  second_camera_host: ""
  second_camera_user: ""
  second_camera_password: ""
  second_two_bar_angle: 356.0
  second_three_bar_angle: 61.0
  second_sensor_id: paine_pressure_2
  second_sensor_name: Second pressure
  capture_interval: 60
  shot_count: 3
  capture_timeout: 10
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_tls: false
  gauges: []
schema:
  camera_host: str?
  camera_user: str?
  camera_password: password?
  capture_interval: int(15,86400)
  shot_count: int(1,9)
  capture_timeout: int(1,300)
  two_bar_angle: float(0,359.99)?
  three_bar_angle: float(0,359.99)?
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_tls: bool
  sensor_name: str?
  sensor_id: str?
  state_topic: str?
  device_id: str?
  device_name: str?
  second_camera_host: str
  second_camera_user: str
  second_camera_password: password
  second_two_bar_angle: float(0,359.99)
  second_three_bar_angle: float(0,359.99)
  second_sensor_id: str
  second_sensor_name: str
  second_device_id: str?
  second_device_name: str?
  second_state_topic: str?
  gauges:
    - camera_host: str
      camera_user: str
      camera_password: password
      sensor_id: str
      two_bar_angle: float(0,359.99)
      three_bar_angle: float(0,359.99)
      sensor_name: str?
      device_id: str?
      device_name: str?
      state_topic: str?
      capture_interval: int(15,86400)?
      shot_count: int(1,9)?
      capture_timeout: int(1,300)?
      mqtt_host: str?
      mqtt_port: port?
      mqtt_user: str?
      mqtt_password: password?
      mqtt_tls: bool?
