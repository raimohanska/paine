configuration:
  camera_user:
    name: Camera 1 — username
  camera_password:
    name: Camera 1 — password
  sensor_id:
    name: Camera 1 — sensor ID
    description: Keep the existing ID when upgrading to preserve the HA entity.
  sensor_name:
    name: Camera 1 — sensor name
  device_id:
    name: Camera 1 — device ID
  device_name:
    name: Camera 1 — device name
  state_topic:
    name: Camera 1 — state topic
  two_bar_angle:
    name: Camera 1 — 2-bar tick angle
  three_bar_angle:
    name: Camera 1 — 3-bar tick angle
  second_camera_host:
    name: Camera 2 — address (leave empty to disable)
    description: >-
      Optional second camera. Enter a hostname/IP or host:port (RTSP default 554)
      to enable it. Leave empty for one camera. Uses the shared MQTT and timing settings.
  second_camera_user:
    name: Camera 2 — username
  second_camera_password:
    name: Camera 2 — password
  second_sensor_id:
    name: Camera 2 — sensor ID
    description: >-
      Must differ from Camera 1. The default state topic is paine/<sensor_id>/state
      and the default device ID is <sensor_id>_device.
  second_sensor_name:
    name: Camera 2 — sensor name
  second_two_bar_angle:
    name: Camera 2 — 2-bar tick angle
    description: Calibrate for the second camera's view; do not assume Camera 1's angles apply.
  second_three_bar_angle:
    name: Camera 2 — 3-bar tick angle
    description: Calibrate separately, clockwise from image-right, like Camera 1.
  second_device_id:
    name: Camera 2 — device ID override (optional)
  second_device_name:
    name: Camera 2 — device name override (optional)
  second_state_topic:
    name: Camera 2 — state topic override (optional)
  gauges:
    name: Camera/gauge profiles
    description: >-
      Optional advanced YAML profiles. For two cameras, use the normal camera and
      Second camera fields below; leave this list empty. Old settings keep working.
      Add one entry per camera with camera_host (supports host:port), camera_user,
      camera_password, sensor_id, two_bar_angle and three_bar_angle. Each profile
      gets its own sensor, device, topic, cache, and interval. MQTT connection
      and capture timing inherit top-level defaults unless overridden. Use the
      YAML editor for profiles; see the app Documentation for an example.
  shot_count:
    name: Shots per pressure reading
    description: >-
      Capture this many shots and publish their median (middle value), not their
      arithmetic mean. Default 3; odd counts are recommended. A median of 3
      tolerates one outlier. Every shot must produce a valid measurement.
  capture_interval:
    name: Reading interval (seconds)
    description: >-
      Seconds between pressure reading batches, default 60. Captures never
      overlap; slow batches and other gauges can make the actual interval longer.
      Expiry is automatic: at least 300 seconds, or three reading intervals.
  camera_host:
    name: Camera 1 — address (IP or hostname, optionally :port)
    description: >-
      Supports host:port, for example 192.168.1.10:8554. The default RTSP port
      is 554 when omitted. For port forwarding, use the reachable forwarding
      address and forwarded port. Do not include rtsp://, a stream path, or
       credentials.
